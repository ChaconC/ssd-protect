name: Repository

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository:
    name: Repository checks
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # GitHub checks out the PR's test merge. Its first parent is the base.
      - run: ./scripts/check-repo HEAD^1
      - run: swift test
      - run: ./scripts/build-app
